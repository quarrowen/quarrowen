# Optional: a second world (Sky Islands) next to the family server, with portals between them.
#   docker compose -p quarrowen -f compose.yaml -f compose.two-worlds.yaml up -d --build
# Then follow "Two worlds and portals" in docs/playtest.md to connect them.

services:
  quarrowen-sky:
    image: quarrowen-server
    container_name: quarrowen-sky
    restart: unless-stopped
    stop_grace_period: 30s
    network_mode: host
    depends_on: [quarrowen]
    environment:
      VOXEL_NAME: ${SKY_NAME:-Sky Islands}
      VOXEL_MOTD: Start on a tiny island
      VOXEL_MODS: skyblock
      VOXEL_WORLD: sky
      VOXEL_PORT: "24567"   # the family server uses 24565 (and 24566 for its status)
      VOXEL_ADMINS: ${ADMINS}
      VOXEL_ALLOWLIST: ${ALLOWLIST}
      VOXEL_UGC: ${CREATIONS:-approval}
      VOXEL_CHAT_FILTER: ${CHAT_FILTER:-on}
      VOXEL_SEED_MODS: ${SEED_MODS:-update}
      VOXEL_BACKUP_INTERVAL: "60"
      VOXEL_BACKUP_KEEP: "48"
    volumes:
      - quarrowen-sky-data:/data
      - ${MODS_DIR:-./mods}:/mods  # the same mods as the family server

volumes:
  quarrowen-sky-data:
    name: quarrowen-sky-data
