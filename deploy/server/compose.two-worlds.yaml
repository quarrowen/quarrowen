# Optional: a second world (Sky Islands) next to the family server, with portals between them.
#   docker compose -p quarrowen -f compose.yaml -f compose.two-worlds.yaml up -d --build
# Then follow "Two worlds and portals" in docs/playtest.md to connect them.

services:
  quarrowen-sky:
    image: ${QW_IMAGE:-ghcr.io/quarrowen/quarrowen/server:latest}
    container_name: quarrowen-sky
    restart: unless-stopped
    stop_grace_period: 30s
    network_mode: host
    depends_on: [quarrowen]
    environment:
      QW_NAME: ${SKY_NAME:-Sky Islands}
      QW_MOTD: Start on a tiny island
      QW_MODS: skyblock
      QW_WORLD: sky
      QW_PORT: "24567"   # the family server uses 24565 (and 24566 for its status)
      QW_ADMINS: ${ADMINS}
      QW_ALLOWLIST: ${ALLOWLIST}
      QW_UGC: ${CREATIONS:-approval}
      QW_CHAT_FILTER: ${CHAT_FILTER:-on}
      QW_SEED_MODS: ${SEED_MODS:-update}
      QW_BACKUP_INTERVAL: "60"
      QW_BACKUP_KEEP: "48"
    logging:  # as the family server: bounded, or it grows until the disk is full
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - quarrowen-sky-data:/data
      - ${MODS_DIR:-./mods}:/mods  # the same mods as the family server

volumes:
  quarrowen-sky-data:
    name: quarrowen-sky-data
