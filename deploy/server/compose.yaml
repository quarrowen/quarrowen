# Quarrowen family server for a Linux box with Docker.
#   cp .env.example .env    # then edit the names
#   docker compose up -d --build
#   docker compose logs -f
# See docs/playtest.md for the whole setup (Macs included).

services:
  quarrowen:
    build: ../..
    image: quarrowen-server
    container_name: quarrowen
    restart: unless-stopped
    stop_grace_period: 30s  # the server saves the world on SIGTERM
    # Host networking: the game port (UDP 24565) and the status port (UDP 24566) are the machine's own,
    # so Macs on the home network find the server in Multiplayer > LAN.
    network_mode: host
    environment:
      QW_NAME: ${SERVER_NAME:-Family Server}
      QW_MOTD: ${SERVER_MOTD:-Be kind, build big}
      QW_MODS: ${GAME:-vanilla}
      QW_WORLD: ${WORLD:-family}
      QW_PORT: "24565"
      QW_ADMINS: ${ADMINS}
      QW_ALLOWLIST: ${ALLOWLIST}
      QW_UGC: ${CREATIONS:-approval}
      # update: refresh the mods that ship with the engine on every start; missing: keep your edits; never: hands off
      QW_SEED_MODS: ${SEED_MODS:-update}
      QW_CHAT_FILTER: ${CHAT_FILTER:-on}
      QW_BACKUP_INTERVAL: "60"
      QW_BACKUP_KEEP: "48"
    # Docker keeps a container's stdout for ever by default, and a server that is never restarted is
    # exactly the case where that fills the disk. Three days of talking is plenty to debug from.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - quarrowen-data:/data
      # The mods the server loads live on the host: add a folder here and restart, no rebuild needed.
      - ${MODS_DIR:-./mods}:/mods

volumes:
  quarrowen-data:
    # Named outright, so the world does not move when this folder is renamed: Compose otherwise prefixes
    # the volume with whatever the directory happens to be called.
    name: quarrowen-data
