# Quarrowen family server for a home Linux box with Docker.
#   cp .env.example .env    # then edit the names
#   docker compose up -d --build
#   docker compose logs -f
# See docs/playtest.md for the whole setup (Macs included).

services:
  quarrowen:
    build: ../..
    image: quarrowen-server
    container_name: quarrowen
    restart: unless-stopped
    stop_grace_period: 30s  # the server saves the world on SIGTERM
    # Host networking: the game port (UDP 24565) and the status port (UDP 24566) are the machine's own,
    # so Macs on the home network find the server in Multiplayer > LAN.
    network_mode: host
    environment:
      VOXEL_NAME: ${SERVER_NAME:-Family Server}
      VOXEL_MOTD: ${SERVER_MOTD:-Be kind, build big}
      VOXEL_MODS: ${GAME:-vanilla}
      VOXEL_WORLD: ${WORLD:-family}
      VOXEL_PORT: "24565"
      VOXEL_ADMINS: ${ADMINS}
      VOXEL_ALLOWLIST: ${ALLOWLIST}
      VOXEL_UGC: ${CREATIONS:-approval}
      # update: refresh the mods that ship with the engine on every start; missing: keep your edits; never: hands off
      VOXEL_SEED_MODS: ${SEED_MODS:-update}
      VOXEL_CHAT_FILTER: ${CHAT_FILTER:-on}
      VOXEL_BACKUP_INTERVAL: "60"
      VOXEL_BACKUP_KEEP: "48"
    volumes:
      - quarrowen-data:/data
      # The mods the server loads live on the host: add a folder here and restart, no rebuild needed.
      - ${MODS_DIR:-./mods}:/mods

volumes:
  quarrowen-data:
