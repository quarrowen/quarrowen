name: CI

# Paused to save CI minutes while only macOS on Apple silicon is targeted (user, 2026-09-15): runs only
# when started by hand from the Actions tab. To turn it back on, restore these triggers:
#   push: {branches: [main, master], tags: ["v*"]}
#   pull_request:
on:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, os: ubuntu-24.04 }
          - { platform: linux-arm64, os: ubuntu-24.04-arm }
          - { platform: windows-x86_64, os: windows-latest }
          - { platform: macos, os: macos-14 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.platform == 'linux-x86_64' && 'x86_64-unknown-linux-gnu' || matrix.platform == 'linux-arm64' && 'aarch64-unknown-linux-gnu' || 'x86_64-pc-windows-msvc' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Build
        shell: bash
        run: tools/build_native.sh ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: native/bin/${{ matrix.platform }}
          if-no-files-found: error

  test:
    name: Tests
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x86_64
          path: native/bin/linux-x86_64
      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Run test suite (native)
        run: tools/run_tests.sh
      - name: Run test suite (GDScript fallbacks)
        run: QW_NATIVE=0 PORT_BASE=26600 tools/run_tests.sh

  export:
    name: Export builds
    needs: [native, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts
      - name: Place native libraries
        run: |
          for dir in artifacts/native-*; do
            platform="${dir#artifacts/native-}"
            mkdir -p "native/bin/$platform"
            cp -r "$dir"/. "native/bin/$platform/"
          done
          ls -R native/bin
      - name: Install Godot and export templates
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz -d "$RUNNER_TEMP/tpz"
          mv "$RUNNER_TEMP/tpz/templates/"* "$templates/"
      - name: Export
        run: tools/export.sh
      - uses: actions/upload-artifact@v4
        with:
          name: builds
          path: build
          if-no-files-found: error

  docker:
    name: Server image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/server
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
