name: CI

# Two different things happen here, and the split matters:
#
#   Every push and pull request runs the TESTS. That is what catches a mistake while it is still cheap.
#
#   Only a v* TAG builds anything. The server image and the macOS export are cut from tags alone, because
#   the game refuses a client whose protocol differs from the server's, and the Macs only ever update
#   themselves to released versions. An image following master would quietly move the family server ahead
#   of the children's clients, and they would be turned away at the door with no obvious reason why.
#
# macOS on Apple silicon is the only thing shipped today, so it is the only thing exported. Windows and
# the Linux desktop export are off; the Linux *native library* stays, because the test suite runs on a
# Linux runner and needs it (a macOS runner costs ten times the minutes for the same answer).
#
# The server image goes to GitHub Packages (ghcr.io/<owner>/<repo>/server) so the family server pulls it
# rather than compiling Godot and Rust on the box. NOTE: a new package is PRIVATE until somebody makes it
# public once, in Packages -> the package -> settings -> change visibility.
#
# The macOS build made here is UNSIGNED and is a check that a clean checkout still exports, not something
# to hand to anyone. Releases are cut on the maintainer's Mac with tools/make_release.sh, which signs and
# notarizes with the Developer ID certificate (docs/distribution.md).
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  CARGO_TERM_COLOR: always

jobs:
  # For the test runner, which is Linux. Not something anybody installs.
  native:
    name: Native (linux-x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Build
        run: tools/build_native.sh linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-x86_64
          path: native/bin/linux-x86_64
          if-no-files-found: error

  # The library that actually ships. Its own job because a macOS runner costs ten times a Linux one, and
  # only the tagged export needs it - there is no reason to spend that on every push to master.
  native-macos:
    name: Native (macos)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Build
        run: tools/build_native.sh macos
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: native/bin/macos
          if-no-files-found: error

  test:
    name: Tests
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x86_64
          path: native/bin/linux-x86_64
      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Run test suite (native)
        run: tools/run_tests.sh
      - name: Run test suite (GDScript fallbacks)
        run: QW_NATIVE=0 PORT_BASE=26600 tools/run_tests.sh

  export:
    name: Export macOS
    needs: [native-macos, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-macos
          path: native/bin/macos
      - name: Install Godot and export templates
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz -d "$RUNNER_TEMP/tpz"
          mv "$RUNNER_TEMP/tpz/templates/"* "$templates/"
      - name: Export
        run: tools/export.sh macOS
      - uses: actions/upload-artifact@v4
        with:
          name: macos-unsigned
          path: build
          if-no-files-found: error

  docker:
    name: Server image
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/server
          # Only tags reach here, so :0.40.0, :0.40 and :latest all mean a released version. A server
          # can sit on :latest and follow releases, or pin :0.40 and stay on that line.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
