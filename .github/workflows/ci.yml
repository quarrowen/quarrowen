name: CI

# macOS on Apple silicon is the only thing shipped today, so that is the only thing built here. Windows
# and the Linux desktop export are off; the Linux *native library* stays, because the test suite runs on
# a Linux runner and needs it (a macOS runner costs ten times the minutes for the same answer).
#
# The server image is built and published to GitHub Packages (ghcr.io/<owner>/<repo>/server) so the family
# server can pull it rather than compile Godot and Rust on the box. NOTE: a new package is PRIVATE until
# somebody makes it public once, in Packages -> the package -> settings -> change visibility.
#
# The macOS build made here is UNSIGNED. Releases are still cut on the maintainer's Mac with
# tools/make_release.sh, which signs and notarizes with the Developer ID certificate (docs/distribution.md).
# This one exists to prove the export works, not to hand to anyone.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, os: ubuntu-24.04 }  # for the test runner, not for shipping
          - { platform: macos, os: macos-14 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-unknown-linux-gnu' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Build
        shell: bash
        run: tools/build_native.sh ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: native/bin/${{ matrix.platform }}
          if-no-files-found: error

  test:
    name: Tests
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x86_64
          path: native/bin/linux-x86_64
      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Run test suite (native)
        run: tools/run_tests.sh
      - name: Run test suite (GDScript fallbacks)
        run: QW_NATIVE=0 PORT_BASE=26600 tools/run_tests.sh

  export:
    name: Export macOS
    needs: [native, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-macos
          path: native/bin/macos
      - name: Install Godot and export templates
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz -d "$RUNNER_TEMP/tpz"
          mv "$RUNNER_TEMP/tpz/templates/"* "$templates/"
      - name: Export
        run: tools/export.sh macOS
      - uses: actions/upload-artifact@v4
        with:
          name: macos-unsigned
          path: build
          if-no-files-found: error

  docker:
    name: Server image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/server
          # master -> :master and :latest, a tag -> :0.40.0 and :0.40, so a server can follow either.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
