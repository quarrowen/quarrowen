name: CI

# Two different things happen here, and the split matters:
#
#   Every push and pull request runs the TESTS. That is what catches a mistake while it is still cheap.
#
#   Only a v* TAG builds anything. The server image and the macOS export are cut from tags alone, because
#   the game refuses a client whose protocol differs from the server's, and the Macs only ever update
#   themselves to released versions. An image following master would quietly move the family server ahead
#   of the children's clients, and they would be turned away at the door with no obvious reason why.
#
# macOS and Windows are both exported on a tag, and both are offered on the download page. This comment
# said "Windows and the Linux desktop export are off" until 28 September 2026 and was wrong about half
# of that - the Windows jobs below have been running on tags, and make_release.sh has been pulling their
# artifact onto the page since 0.41.1. Only the Linux *desktop* export is off; the Linux native library
# stays, because the test suite runs on a Linux runner and needs it (a macOS runner costs ten times the
# minutes for the same answer).
#
# Both images the homelab runs go to GitHub Packages - ghcr.io/<owner>/<repo>/server and .../hub - so the
# family box pulls them rather than compiling Godot, Rust and the hub itself. NOTE: a new package is
# PRIVATE until somebody makes it public once, in Packages -> the package -> settings -> change
# visibility. Public packages also have no storage limit, where private ones share a 500 MB quota.
#
# SIGNING. Nothing here signs anything unless the `release` job runs, and it cannot until somebody adds
# the secrets and the approval environment (docs/distribution.md). Until then every macOS build made here
# is ad-hoc signed, Gatekeeper refuses it, and it stays in an artifact called `macos-unsigned` - the job
# exists to prove a clean checkout still exports. What players download is signed and notarized on the
# maintainer's Mac by tools/make_release.sh and uploaded by tools/publish_site.sh, neither of which can
# see a CI artifact. So a build from here cannot reach anybody by accident.
#
# The `release` job is the way to change that, and it is off until SIGN_IN_CI is set. NOTE, because this
# was got wrong once: naming an `environment:` does NOT by itself gate anything. GitHub creates a missing
# environment implicitly with no protection rules, and the job then runs unattended. The approval only
# exists once somebody adds required reviewers to it by hand. Both, or neither.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  CARGO_TERM_COLOR: always

jobs:
  # For the test runner, which is Linux. Not something anybody installs.
  native:
    name: Rust library (linux-x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Build
        run: tools/build_native.sh linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-x86_64
          path: native/bin/linux-x86_64
          if-no-files-found: error

  # The libraries that ship. Their own job because a release is the only thing that needs them, and a
  # macOS runner costs ten times a Linux one - no reason to spend that on every push to master.
  native-macos:
    name: Rust library (macos)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Build
        run: tools/build_native.sh macos
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: native/bin/macos
          if-no-files-found: error

  test:
    name: Tests
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x86_64
          path: native/bin/linux-x86_64
      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Run test suite
        run: tools/run_tests.sh
      # The suite writes every server and test log to a temporary folder and prints where. Without this
      # a CI-only failure can only be guessed at, which is worse than not knowing.
      - name: Collect logs
        if: failure()
        run: |
          mkdir -p ci-logs
          cp -r /tmp/quarrowen-tests.*/. ci-logs/ 2>/dev/null || true
          ls -la ci-logs | head -40
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs
          path: ci-logs
          if-no-files-found: warn

  native-windows:
    name: Rust library (windows)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Build
        shell: bash
        run: tools/build_native.sh windows-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows-x86_64
          path: native/bin/windows-x86_64
          if-no-files-found: error

  export:
    name: Export macOS (unsigned, not published)
    needs: [native-macos, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-macos
          path: native/bin/macos
      - name: Install Godot and export templates
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz -d "$RUNNER_TEMP/tpz"
          mv "$RUNNER_TEMP/tpz/templates/"* "$templates/"
      - name: Export
        run: tools/export.sh macOS
      - uses: actions/upload-artifact@v4
        with:
          name: macos-unsigned
          path: build
          if-no-files-found: error

  # The signed release, cut by CI so that nobody's laptop is a dependency.
  #
  # The certificate signs software as a named person, so this job is deliberately hard to reach: it runs
  # only on a v* tag, and only after a human approves it in the "release" environment. A push cannot use
  # the signing identity on its own, which is the property worth having - secrets are readable by any
  # step in a job that can reach them, so the gate is *reaching the job*, not hiding the values.
  #
  # Set-up (once, see docs/distribution.md): an environment called "release" with yourself as a required
  # reviewer, and six secrets. Rotating any of them is a matter of replacing the secret.
  release:
    name: Sign and publish
    needs: [native-macos, test]
    # Off unless somebody turns it on: set the **repository** variable SIGN_IN_CI to "true" once the
    # secrets and the reviewers exist. Without this the job runs on every tag and fails for want of a
    # certificate, and a tag build that is always red is a tag build nobody reads.
    #
    # **It has to be a repository (or organisation) variable, not an environment one.** A job-level `if`
    # is evaluated before the runner declares the job's environment, so an environment-scoped variable
    # reads as empty here and this job would never run - on a tag build that goes green with nothing
    # published. `release-gate` below exists to say so out loud. (checked against GitHub's contexts
    # reference, 2026-09-29)
    if: startsWith(github.ref, 'refs/tags/v') && vars.SIGN_IN_CI == 'true'
    # **The two actions below are pinned to commit SHAs, and only in this job.** A tag like @v4 is
    # mutable: whoever controls it can change what runs, and what runs *here* runs beside a signing
    # certificate and a notarisation key. Elsewhere in this file a moved tag costs a failed build;
    # here it would cost the keys. (2026-09-29)
    runs-on: macos-14
    environment: release
    permissions:
      contents: write        # create the GitHub release and push the pages branch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          fetch-depth: 0     # publish_site.sh works in a worktree on the pages branch
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: native-macos
          path: native/bin/macos
      - name: Install Godot and export templates
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          templates="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz -d "$RUNNER_TEMP/tpz"
          mv "$RUNNER_TEMP/tpz/templates/"* "$templates/"

      # A keychain of its own, unlocked only for this run and deleted at the end, so the certificate is
      # never added to the runner's default keychain where a later step could stumble on it.
      - name: Unlock the signing identity
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Lets codesign use the key without a UI prompt, which would hang a runner for ever.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          # Only this keychain is searched; system roots live elsewhere and are still found.
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(.*\)"/found identity: \1/p'

      - name: Build, sign, notarize and publish
        env:
          QUARROWEN_REQUIRE_SIGNING: "1"   # fail rather than publish an ad-hoc signed build
          QUARROWEN_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          QUARROWEN_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          printf '%s' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release_key.pem"
          export QUARROWEN_NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          export QUARROWEN_RELEASE_KEY="$RUNNER_TEMP/release_key.pem"
          version="${GITHUB_REF_NAME#v}"
          # The tag's subject line, one line of it: the release notes end up inside a JSON string in
          # update.json, and a commit message with a blank line in it would produce invalid JSON.
          #
          # **Fetch the tag object first.** `actions/checkout` leaves a *lightweight* local tag even when
          # the one that was pushed is annotated, and `%(contents:subject)` on a lightweight tag quietly
          # falls back to the *commit* subject. 0.42.1 shipped with "Cut 0.42.1, because a tag that
          # failed cannot be reused" as its headline on the download page - an internal commit message,
          # on the page people are sent to. Silent because both branches produce a plausible sentence.
          # (2026-09-29)
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
          if [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}" 2>/dev/null)" = "tag" ]; then
            export NOTES="$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME" | head -1)"
          else
            echo "::warning title=No annotated tag::${GITHUB_REF_NAME} is not annotated here, so the release notes fall back to a generic line rather than a commit subject."
            NOTES=""
          fi
          [ -n "$NOTES" ] || NOTES="Quarrowen $version"
          echo "release notes: $NOTES"
          export BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          git config user.name "Quarrowen release"
          git config user.email "releases@quarrowen.com"
          tools/make_release.sh
          tools/publish_site.sh --with-release
          # The reference, to quarrowen.com/docs/, so a release never ships with a site describing the
          # version before it. Safe to run straight after the site publish: both work in a worktree on
          # the pages branch and git allows only one at a time, but publish_site.sh removes its own on
          # exit. This one writes `docs/` alone and leaves update.json where it is. (2026-09-24)
          tools/publish_docs.sh
          echo "published $version"

      - name: Put the keys beyond use
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/release_key.pem" "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/build.keychain" 2>/dev/null || true

  # Says whether a tag is going to publish, because the alternative is silence. The release job is
  # gated on a variable, and a gate that is off looks exactly like a gate that is on and simply had
  # nothing to do: the tag build goes green either way. This runs on every tag, cannot fail the build,
  # and costs a few seconds. (2026-09-29)
  release-gate:
    name: Will this tag publish?
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Report
        env:
          SIGN_IN_CI: ${{ vars.SIGN_IN_CI }}
        run: |
          if [ "${SIGN_IN_CI:-}" = "true" ]; then
            echo "SIGN_IN_CI is true, so the release job will run and wait for its reviewer."
          else
            echo "::warning title=This tag will not publish::SIGN_IN_CI is not 'true' - the release job is skipped and nothing reaches quarrowen.com."
            echo "SIGN_IN_CI reads as: '${SIGN_IN_CI:-<unset>}'"
            echo ""
            echo "If you believe you set it, check *where*. It must be a repository or organisation"
            echo "variable. A job-level 'if' is evaluated before the environment is declared, so a"
            echo "variable set on the release *environment* is invisible to it and reads as empty."
          fi

  # Windows is built here and **is** published: make_release.sh downloads this artifact and puts it on
  # the download page. (This comment said "built but not published" until 28 September 2026, which had
  # been untrue since 0.41.1.)
  #
  # What is genuinely still true: it is unsigned, so Windows shows a SmartScreen warning, and it is
  # deliberately **not in update.json** - the install script for Windows exists in updater.gd but has
  # never been run by anybody, and an untested script that replaces a folder is not a thing to arm.
  # The consequence to keep in mind: a Windows player never updates itself, so a protocol bump locks
  # them out until they download again.
  export-windows:
    name: Export Windows (untested)
    needs: [native-windows, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-windows-x86_64
          path: native/bin/windows-x86_64
      - name: Install Godot and export templates
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz -d "$RUNNER_TEMP/tpz"
          mv "$RUNNER_TEMP/tpz/templates/"* "$templates/"
      - name: Export
        run: tools/export.sh Windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-untested
          path: build
          if-no-files-found: error

  # Both images the homelab runs: the game server, and the hub it lists itself on. One job with a matrix
  # rather than two, so they cannot drift apart in how they are tagged or where they are pushed.
  docker:
    name: Image (${{ matrix.image }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: server, context: . }
          - { image: hub, context: services/hub }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          # Only tags reach here, so :0.40.0, :0.40 and :latest all mean a released version. A server
          # can sit on :latest and follow releases, or pin :0.40 and stay on that line.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # The homelab is amd64. Building arm64 too would mean emulating it under QEMU, which takes
          # about three times as long and doubles what the package stores, for nothing anyone runs.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
