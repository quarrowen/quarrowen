[package]
name = "quarrowen_native"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native hot paths for the Quarrowen engine: chunk storage, player physics, meshing, process signals."

[lib]
crate-type = ["cdylib"]

[dependencies]
# experimental-threads: meshing runs on Godot WorkerThreadPool threads.
godot = { version = "0.5.5", features = ["api-4-7", "experimental-threads"] }
# Pure-Rust math so trig results are identical on every platform (client/server determinism).
libm = "0.2.16"
# QuickJS-NG JavaScript engine for server mods written in JavaScript (sandboxed: no fs/network).
rquickjs = { version = "0.13.0", features = ["loader"] }
tiny_http = { version = "0.12", default-features = false }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.4"

# **iOS has no prebuilt QuickJS bindings**, so generate them at build time. `rquickjs-sys` ships a
# checked-in `bindings/<target>.rs` for the platforms it knows about and iOS is not one of them; its
# own build warning says to use `bindgen`, which reads the C headers with libclang. Xcode supplies
# that clang. See tools/build_native.sh for the matching link flags. (2026-09-23)
[target.'cfg(target_os = "ios")'.dependencies]
rquickjs = { version = "0.13.0", features = ["loader", "bindgen"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
