# Two different games from one image. Any Quarrowen client can join either:
#   vanilla  -> <host>:24565
#   skyblock -> <host>:24567
# Each server answers menu status queries (name, players, ping) on its port + 1.
# Put extra or overriding mods in ./server-mods/<mod_id>/ (mounted at /mods).
# Mod settings: QW_MOD_SETTINGS takes the settings as JSON (or a path to a file), and /data/mod_settings.json
# is read too. Admins can change them in game afterwards, and that is kept with the world.

x-server: &server
  build: .
  image: quarrowen-server
  restart: unless-stopped
  stop_grace_period: 30s
  # Without this Docker keeps stdout for ever, which on a server that is never restarted means it keeps
  # growing until the disk is full.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  volumes:
    - ./server-mods:/mods:ro

services:
  vanilla:
    <<: *server
    environment:
      QW_MODS: vanilla
      QW_METRICS: "60"
      QW_MOD_SETTINGS: '{"vanilla": {"monsters": "normal", "day_minutes": 20}}'
    ports:
      - "24565:24565/udp"
      - "24566:24566/udp"
    volumes:
      - ./server-mods:/mods:ro
      - vanilla-data:/data

  skyblock:
    <<: *server
    environment:
      QW_MODS: skyblock
      QW_MAX_PLAYERS: "32"
    ports:
      - "24567:24565/udp"
      - "24568:24566/udp"
    volumes:
      - ./server-mods:/mods:ro
      - skyblock-data:/data

volumes:
  vanilla-data:
  skyblock-data:
