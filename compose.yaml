# Two different games from one image. Any VoxelCraft client can join either:
#   vanilla  -> <host>:24565
#   skyblock -> <host>:24567
# Each server answers menu status queries (name, players, ping) on its port + 1.
# Put extra or overriding mods in ./server-mods/<mod_id>/ (mounted at /mods).

x-server: &server
  build: .
  image: voxelcraft-server
  restart: unless-stopped
  stop_grace_period: 30s
  volumes:
    - ./server-mods:/mods:ro

services:
  vanilla:
    <<: *server
    environment:
      VOXEL_MODS: vanilla
      VOXEL_METRICS: "60"
    ports:
      - "24565:24565/udp"
      - "24566:24566/udp"
    volumes:
      - ./server-mods:/mods:ro
      - vanilla-data:/data

  skyblock:
    <<: *server
    environment:
      VOXEL_MODS: skyblock
      VOXEL_MAX_PLAYERS: "32"
    ports:
      - "24567:24565/udp"
      - "24568:24566/udp"
    volumes:
      - ./server-mods:/mods:ro
      - skyblock-data:/data

volumes:
  vanilla-data:
  skyblock-data:
